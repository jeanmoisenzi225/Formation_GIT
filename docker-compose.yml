services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: garage_user
      POSTGRES_PASSWORD: garage_password
      POSTGRES_DB: garage_app
    ports:
      - "5432:5432"
    volumes:
      - garage_postgres_data:/var/lib/postgresql/data

volumes:
  garage_postgres_data:
